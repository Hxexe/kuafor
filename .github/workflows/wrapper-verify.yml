name: Gradle Wrapper Verify

on:
  push:
    branches: [main]
    paths:
      - "gradle/wrapper/gradle-wrapper.jar"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/wrapper-verify.yml"
  workflow_dispatch: {}

jobs:
  verify-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify wrapper launches and configures :app (no secrets required)
        run: ./gradlew :app:tasks --console=plain
