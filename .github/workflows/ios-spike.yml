name: iOS Spike Verification

on:
  push:
    branches: [ios-spike]
  workflow_dispatch: {}

jobs:
  verify-ios-simulator:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: G1 - Compose Multiplatform iOS Simulator render testi
        run: ./gradlew :composeApp:iosSimulatorArm64Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-results
          path: composeApp/build/test-results/**
